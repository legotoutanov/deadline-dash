[project]
name = "deadline-dash"
version = "0.1.0"
description = "Dodge the grass, don't get Deaned."
requires-python = ">=3.12"
dependencies = [
    "pygame>=2.5",
    "windows-curses>=2.3; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.10", "ruff>=0.6", "hypothesis>=6.100", "mutmut>=3.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "pygame.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["UP042", "UP047"]  # str+Enum and old-style TypeVar match the rest of the bootcamp

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
